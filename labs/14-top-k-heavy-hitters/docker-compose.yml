services:
  mysql:
    image: mysql:8.0.43
    container_name: lab14-mysql
    command:
      - --server-id=1
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: lab
    ports:
      - "${MYSQL_PORT:-3320}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 5s
      timeout: 5s
      retries: 60

  redis:
    image: redis:8.0.3
    container_name: lab14-redis
    ports:
      - "${REDIS_PORT:-6392}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 60

  adminer:
    image: adminer:4.8.1
    container_name: lab14-adminer
    profiles: ["ui"]
    ports:
      - "8094:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:
