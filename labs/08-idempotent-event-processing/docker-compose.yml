services:
  mysql:
    image: mysql:8.0.43
    container_name: lab08-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
    environment:
      - MYSQL_ROOT_PASSWORD=lab
      - MYSQL_DATABASE=lab08
    ports:
      # 3310 on the host: labs 02/03/04/06 already squat on the lower ports.
      - "${MYSQL_PORT:-3310}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - mysqldata:/var/lib/mysql

  kafka:
    image: apache/kafka:3.7.2
    container_name: lab08-kafka
    environment:
      # Single-node KRaft, same layout as lab 03: containers reach the broker
      # as kafka:9092, the host (producer, consumer, drills) as localhost:9096.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Explicit topics only: auto-create would silently give the payments
      # topic 1 partition and hide the per-partition stall in drill-poison.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_PORT:-9096}:9096"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 60
    volumes:
      - kafkadata:/var/lib/kafka/data

volumes:
  mysqldata:
  kafkadata:
