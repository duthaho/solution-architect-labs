worker_processes 1;

events { worker_connections 1024; }

http {
    # The pod set lives in a generated file; a deploy is: rewrite + reload.
    # nginx reload is graceful: old workers finish in-flight requests, new
    # workers pick up the new upstream set. No connection is ever dropped by
    # the reload itself.
    include /etc/nginx/upstreams/upstreams.conf;

    # If a pod dies between "removed from conf" and "reload done", retry the
    # request on the next pod — but only idempotent methods (GET). POSTs are
    # NOT retried (nginx default): a replayed create would double-insert.
    # The deploy script therefore drains pods BEFORE restarting them.
    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
