services:
  # The one database. There is no blue-green for this box — that asymmetry is
  # the entire lab: app containers are cattle, the schema is a live migration.
  mysql:
    image: mysql:8.0.43
    container_name: lab09-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=512M
    environment:
      - MYSQL_ROOT_PASSWORD=lab
      - MYSQL_DATABASE=lab09
    ports:
      - "${MYSQL_PORT:-3311}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - mysqldata:/var/lib/mysql

  # The traffic switch. Which pods receive traffic is decided ONLY by
  # state/nginx/upstreams.conf (generated by deploy.py) + `nginx -s reload`.
  # The directory (not the file) is bind-mounted: single-file bind mounts pin
  # an inode, so an atomic rename on the host would be invisible in here.
  gateway:
    image: nginx:1.27-alpine
    container_name: lab09-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./state/nginx:/etc/nginx/upstreams:ro
    depends_on:
      - app-blue-a
      - app-blue-b

  # Four "pods", one image. Each reads its version from
  # /state/<SERVICE_NAME>.version at boot; a deploy = write file + restart.
  # Host ports 1808x are management-only (deploy.py health/version probes) —
  # user traffic goes through the gateway.
  app-blue-a: &app
    build: ./app
    image: lab09-app
    container_name: lab09-app-blue-a
    environment:
      - SERVICE_NAME=app-blue-a
    ports:
      - "${BLUE_A_PORT:-18081}:8000"
    volumes:
      - ./state:/state:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy

  app-blue-b:
    <<: *app
    container_name: lab09-app-blue-b
    environment:
      - SERVICE_NAME=app-blue-b
    ports:
      - "${BLUE_B_PORT:-18082}:8000"

  app-green-a:
    <<: *app
    container_name: lab09-app-green-a
    profiles: ["green"]
    environment:
      - SERVICE_NAME=app-green-a
    ports:
      - "${GREEN_A_PORT:-18083}:8000"

  app-green-b:
    <<: *app
    container_name: lab09-app-green-b
    profiles: ["green"]
    environment:
      - SERVICE_NAME=app-green-b
    ports:
      - "${GREEN_B_PORT:-18084}:8000"

volumes:
  mysqldata:
